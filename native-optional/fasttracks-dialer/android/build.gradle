// Local Expo module: Fasttracks as the phone (dialer) app of a company Android phone, answering ONE verified Exotel click-to-call call automatically.
// Same plugin style as the installed Expo 57 modules. Pure-Kotlin policy tests also run without Gradle (see docs/c2c-auto-answer.md).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.fasttracksdialer'
version = '0.1.0'

android {
  namespace "expo.modules.fasttracksdialer"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}
